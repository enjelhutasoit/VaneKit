name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  snapshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Test on iOS Simulator
        run: |
          UDID="$(bash scripts/ios-simulator-id.sh)"
          xcodebuild test \
            -scheme VaneKit \
            -destination "id=${UDID}" \
            -resultBundlePath "${RUNNER_TEMP}/snapshots.xcresult"
      - name: Upload snapshot images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: Tests/VaneKitTests/__Snapshots__
          if-no-files-found: ignore
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/snapshots.xcresult